name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    # Runner của BTC, dùng chung cho tất cả team, job xếp hàng FIFO.
    # Đổi từ `ubuntu-latest` ngày 04/08: org hết hạn mức GitHub Actions nên job
    # bị chặn trước khi khởi động (không phải lỗi code — xem WORKLOG 04/08).
    # Muốn tự host runner riêng thì tạo ticket cho BTC.
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend, demo and UI dependencies
        # ui/requirements.txt BẮT BUỘC phải có ở đây.
        #
        # Thiếu nó thì ngày 13/08 lặp lại: bản UI mới thêm `import plotly`, khai
        # đúng chỗ trong ui/requirements.txt, nhưng CI không cài nên trang war
        # room không mở nổi — mà CI vẫn xanh, vì ruff không cần import giải được
        # và test khi đó chỉ đụng ui/labels.py. Phát hiện ra 30 phút trước giờ demo.
        run: pip install -r requirements.txt -r demo/requirements.txt -r ui/requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/ demo/ ui/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

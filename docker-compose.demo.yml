# Demo stack — hệ thống bị sự cố + Prometheus.
#
# CHỈ chạy local, không deploy. Backend chính deploy riêng qua render.yaml.
#
#   docker compose -f docker-compose.demo.yml up --build
#
# Sau khi lên:
#   http://localhost:8001/docs        service-thanh-toan
#   http://localhost:8002/docs        service-dat-hang
#   http://localhost:8003/docs        service-kho-hang
#   http://localhost:8004/docs        service-van-chuyen
#   http://localhost:9090/targets     Prometheus — cả 4 target phải UP
#
# Tạo sự cố:  python demo/loadtest.py

name: p035-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      # Máy nào đã có Postgres native chạy sẵn thì đổi port host:
      #   DEMO_POSTGRES_PORT=55432 docker compose -f docker-compose.demo.yml up -d
      #   DATABASE_URL=postgresql://demo:demo@localhost:55432/demo python demo/seed.py
      # Các service demo nói chuyện với nhau qua mạng compose nên không bị ảnh hưởng.
      - "${DEMO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  service-thanh-toan:
    build:
      context: ./demo
    # Đây là service DUY NHẤT có `build:`. `service-dat-hang` dùng lại đúng
    # image này — hai service chung một Dockerfile và một build context, chỉ
    # khác `command` lúc chạy.
    #
    # Không đặt `image:` thì compose tự sinh tên theo từng service
    # (`p035-demo-service-thanh-toan`, `p035-demo-service-dat-hang`) rồi build
    # HAI LẦN cùng một nội dung. Đo ngày 05/08: hai image 357MB có layer trùng
    # hoàn toàn — 714MB cho thứ 357MB là đủ, và gấp đôi thời gian build, trên
    # máy của cả bốn người.
    #
    # ⚠️ Đừng thêm `build:` vào service-dat-hang rồi cho hai bên cùng `image:`
    # này. Đã thử: hai build song song tranh nhau đặt cùng một tag, buildx báo
    # `ERROR: image "...": already exists` và `docker compose build` **exit 1**
    # — image vẫn ra nhưng lệnh coi như thất bại, đủ để làm đỏ CI hay script.
    image: p035-demo-service:latest
    command: sh -c "exec uvicorn service_thanh_toan.main:app --host 0.0.0.0 --port 8001"
    # UC-2: giới hạn thấp có chủ đích để /pay/batch tạo OOM trong thời gian demo.
    mem_limit: 128m
    # Bằng mem_limit = tắt swap. Thiếu dòng này thì Docker cho container dùng
    # thêm swap bằng đúng ngần đó, nên chạm trần RAM nó chỉ chậm đi chứ KHÔNG
    # bị OOM-kill — đo trên macOS: RAM đứng ở 127.9MiB/128MiB qua 12 lần gọi
    # /pay/batch mà RestartCount vẫn = 0. Có dòng này thì chết ở batch thứ 8,
    # RestartCount 0 -> 1, đúng kịch bản UC-2 và giống nhau trên mọi máy.
    memswap_limit: 128m
    # Nếu thiếu restart policy, OOM chỉ để container ở Exited (137), không tạo
    # được tín hiệu restart loop mà Agent cần quan sát.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
      PORT: "8001"
      # UC-4 — mô phỏng deploy v1.4.3 thiếu migration. Mặc định TẮT.
      #
      # Phải khai báo ở đây mới truyền được vào container: đặt biến ở shell
      # trước `docker compose up` chỉ tới compose, KHÔNG tới process bên trong.
      # Đo ngày 11/08: `printenv` trong container trả rỗng cho tới khi thêm dòng
      # này — loại lỗi làm mất nửa buổi nếu không kiểm tận trong container.
      #
      #   SIMULATE_MISSING_MIGRATION=1 docker compose -f docker-compose.demo.yml up -d
      SIMULATE_MISSING_MIGRATION: ${SIMULATE_MISSING_MIGRATION:-0}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  service-dat-hang:
    # KHÔNG có `build:` — dùng lại đúng image mà service-thanh-toan build ra.
    image: p035-demo-service:latest
    # Không bao giờ hỏi registry: image này chỉ tồn tại local.
    pull_policy: never
    command: sh -c "exec uvicorn service_dat_hang.main:app --host 0.0.0.0 --port 8002"
    environment:
      # Tên host = tên service trong file này, không phải localhost.
      PAYMENT_SERVICE_URL: http://service-thanh-toan:8001
      PORT: "8002"
    ports:
      - "8002:8002"
    depends_on:
      - service-thanh-toan

  service-kho-hang:
    # Service kiểm kho — lỗi tự nhiên mức P3 khi có tải.
    # Dùng lại image chung, không cần build riêng.
    image: p035-demo-service:latest
    pull_policy: never
    command: sh -c "exec uvicorn service_kho_hang.main:app --host 0.0.0.0 --port 8003"
    environment:
      PORT: "8003"
    ports:
      - "8003:8003"

  service-van-chuyen:
    # Service tính phí vận chuyển — lỗi tự nhiên mức P4 khi có tải.
    # Dùng lại image chung, không cần build riêng.
    image: p035-demo-service:latest
    pull_policy: never
    command: sh -c "exec uvicorn service_van_chuyen.main:app --host 0.0.0.0 --port 8004"
    environment:
      PORT: "8004"
    ports:
      - "8004:8004"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./demo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Giữ lịch sử baseline qua `docker compose down`; chỉ `down -v` mới xoá.
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - service-thanh-toan
      - service-dat-hang
      - service-kho-hang
      - service-van-chuyen

volumes:
  prometheus_data:

# Cấu hình deploy Render — https://render.com/docs/blueprint-spec
#
# Dùng file này để cấu hình nằm trong repo và review được qua PR, thay vì
# bấm tay trên dashboard rồi không ai nhớ đã set gì.
#
# Cách deploy lần đầu:
#   1. render.com → New → Blueprint → chọn repo P-035, branch develop
#   2. Render đọc file này và tạo service
#   3. Điền các biến có sync:false ở Dashboard → Environment (xem ghi chú dưới)
#
# LƯU Ý free tier: service tự ngủ sau 15 phút không có request, cold start
# 30–60s. Jira Automation gọi webhook có thể timeout khi service đang ngủ →
# trước khi demo phải gọi /health vài lần cho service tỉnh trước.

services:
  - type: web
    name: p-035-incident-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # gần VN nhất, giảm latency khi demo
    branch: develop # đổi sang main khi bắt đầu release theo tuần
    autoDeploy: true

    # Render gọi endpoint này để biết service đã sống chưa.
    healthCheckPath: /health

    envVars:
      # Render tự set PORT, không khai báo ở đây.
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # CORS phải có domain UI, không thì trang trên Render gọi API bị chặn và
      # war room trắng trơn mà không có lỗi nào ở backend.
      # Tên miền suy ra từ `name` của service dưới: <name>.onrender.com
      - key: CORS_ORIGINS
        value: http://localhost:8501,https://p-035-war-room.onrender.com

      # LLM — dùng langchain-openai cho provider tương thích OpenAI.
      # Đội dùng Alibaba Cloud Model Studio vì có quota miễn phí.
      - key: LLM_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: MODEL_NAME
        value: qwen-plus
      # Nhiệt độ thấp để chẩn đoán ổn định, đo được độ chính xác trong eval/.
      - key: LLM_TEMPERATURE
        value: "0.2"

      # Điền tay ở Dashboard → Environment (sync:false = không lưu vào repo).
      # Với Alibaba thì đây là API key của DashScope, không phải của OpenAI.
      - key: OPENAI_API_KEY
        sync: false

      # LangSmith — deliverable #4. Thiếu 2 biến này thì configure_tracing()
      # trả về False và trace không được gửi lên (app vẫn chạy bình thường).
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: P-035
      - key: LANGCHAIN_API_KEY
        sync: false

      # Jira — workspace đã tạo. Giá trị không bí mật thì khai luôn ở đây để
      # không phải điền tay và không ai quên.
      - key: JIRA_BASE_URL
        value: https://jibinarybro.atlassian.net
      - key: JIRA_PROJECT_KEY
        value: KAN
      - key: JIRA_EMAIL
        value: thaiduc0201@gmail.com

      # accountId của account Agent. Cổng HITL so giá trị này với người đã
      # chuyển issue sang Remediating — trùng nhau nghĩa là Agent tự duyệt và
      # hành động bị từ chối. Thiếu biến này thì assert_human_approved() raise
      # ValueError chứ không cho qua, nên bắt buộc phải có.
      - key: JIRA_AGENT_ACCOUNT_ID
        value: "712020:1bf02a7a-3621-4611-b358-7e905dd2dcf7"

      # Bí mật — điền tay ở Dashboard → Environment.
      - key: JIRA_API_TOKEN
        sync: false

      # Shared secret để xác thực webhook từ Jira Automation, tránh người
      # ngoài gọi được endpoint remediation. Render tự sinh giá trị random.
      - key: JIRA_WEBHOOK_SECRET
        generateValue: true

  # ── Trang UI: status page (công khai) + war room, một app Streamlit multi-page
  #
  # Từ 22/08 hai trang nằm trong MỘT service: điểm khởi động là
  # `ui/status_page.py`, còn war room ở `ui/pages/war_room.py` được phục vụ tại
  # `/war_room`. Xem `ui/README.md`.
  - type: web
    name: p-035-war-room
    runtime: docker
    dockerfilePath: ./Dockerfile.ui
    plan: free
    region: singapore # cùng region với backend
    branch: develop
    autoDeploy: true

    # Endpoint sức khoẻ có sẵn của Streamlit. Không khai thì Render dùng `/`, mà
    # `/` trả 200 kể cả khi app chưa dựng xong — health check mất ý nghĩa.
    healthCheckPath: /_stcore/health

    envVars:
      # ⚠️ BẮT BUỘC. Thiếu nó thì `ui/` đọc mặc định trong code, và trang sẽ hiện
      # dữ liệu của môi trường khác. Đã vấp ngày 21/08 khi chạy local.
      - key: API_URL
        value: https://p-035-incident-agent.onrender.com

      # Thiếu biến này thì nút "Mở phiếu Jira" bị khoá — đã vấp 21/08.
      - key: JIRA_BASE_URL
        value: https://jibinarybro.atlassian.net

      # ⚠️ CỐ Ý KHÔNG khai `PROM_URL`.
      #
      # Prometheus chỉ chạy trong Docker Compose trên máy người demo, không có
      # địa chỉ công khai. Khai một URL sai thì tệ hơn để trống: nút "kiểm chứng
      # PromQL" sẽ trỏ vào chỗ không tồn tại, và ô "Ảnh hưởng" trả về "không có
      # dữ liệu" mà người xem tưởng hệ thống hỏng.
      #
      # Để trống thì `ui/` tự lùi về mặc định localhost — sai nhưng KHÔNG gây
      # hiểu nhầm cho người ngoài, vì họ không bấm được vào máy người khác.
      #
      # Hệ quả: bản UI trên Render KÉM HƠN bản chạy máy. Demo nên dùng bản máy;
      # bản Render để BTC tự vào xem sau.
